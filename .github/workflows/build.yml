name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
          key: pio-${{ runner.os }}-${{ hashFiles('esp32/platformio.ini') }}
      - name: Install firmware tools
        run: python -m pip install platformio==6.1.19
      - name: Build ESP32-C5 firmware
        run: pio run
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-C5-firmware
          path: |
            esp32/.pio/build/esp32-c5-devkitc-1/firmware.bin
            esp32/.pio/build/esp32-c5-devkitc-1/firmware.factory.bin
            esp32/.pio/build/esp32-c5-devkitc-1/bootloader.bin
            esp32/.pio/build/esp32-c5-devkitc-1/partitions.bin
            esp32/.pio/build/esp32-c5-devkitc-1/firmware.elf
          if-no-files-found: error

  desktop:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tinyprocess
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tinyprocess/package-lock.json
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6
      - name: Install dependencies
        run: npm ci
      - name: Build desktop packages
        run: npm run dist -- --publish never "-c.extraMetadata.homepage=${{ github.server_url }}/${{ github.repository }}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: TinyProcess-${{ matrix.os }}
          path: |
            tinyprocess/dist/*.exe
            tinyprocess/dist/*.dmg
            tinyprocess/dist/*.AppImage
            tinyprocess/dist/*.deb
            tinyprocess/dist/*.zip
            tinyprocess/dist/*.blockmap
            tinyprocess/dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: artifacts/**/*
